<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
<title id="title">Theoretical LSH candidate survival curve</title>
<desc id="desc">Probability that a pair survives 64 bands of 4 MinHash rows as exact Jaccard similarity increases.</desc>
<rect width="900" height="440" fill="white"/>
<text x="450" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold">LSH Candidate Survival</text>
<line x1="80" y1="350" x2="840" y2="350" stroke="#222"/>
<line x1="80" y1="50" x2="80" y2="350" stroke="#222"/>
<g font-family="Arial, sans-serif" font-size="12" fill="#222">
<text x="68" y="354" text-anchor="end">0.0</text><text x="68" y="294" text-anchor="end">0.2</text><text x="68" y="234" text-anchor="end">0.4</text><text x="68" y="174" text-anchor="end">0.6</text><text x="68" y="114" text-anchor="end">0.8</text><text x="68" y="54" text-anchor="end">1.0</text>
<text x="80" y="370" text-anchor="middle">0.0</text><text x="270" y="370" text-anchor="middle">0.25</text><text x="460" y="370" text-anchor="middle">0.5</text><text x="650" y="370" text-anchor="middle">0.75</text><text x="840" y="370" text-anchor="middle">1.0</text>
<text x="460" y="405" text-anchor="middle" font-size="14">Exact Jaccard similarity</text><text x="20" y="200" text-anchor="middle" font-size="14" transform="rotate(-90 20 200)">Candidate survival probability</text>
</g>
<g stroke="#ddd" stroke-width="1"><line x1="80" y1="290" x2="840" y2="290"/><line x1="80" y1="230" x2="840" y2="230"/><line x1="80" y1="170" x2="840" y2="170"/><line x1="80" y1="110" x2="840" y2="110"/><line x1="80" y1="50" x2="840" y2="50"/></g>
<polyline points="80,350 156,348 232,338 308,229 384,107 460,55 536,50 612,50 688,50 764,50 840,50" fill="none" stroke="#1565c0" stroke-width="4"/>
<line x1="627.2" y1="50" x2="627.2" y2="350" stroke="#c62828" stroke-width="2" stroke-dasharray="8 6"/>
<text x="635" y="75" font-family="Arial, sans-serif" font-size="13" fill="#c62828">operating threshold 0.72</text>
<text x="450" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Theoretical curve: 1 - (1 - s^4)^64</text>
</svg>
