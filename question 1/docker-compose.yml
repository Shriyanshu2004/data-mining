services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: annapurna-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: annapurna
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-local-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  postgres:
    image: postgres:16
    container_name: annapurna-postgres
    environment:
      POSTGRES_USER: annapurna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
      POSTGRES_DB: annapurna
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  hive-metastore:
    image: apache/hive:4.0.1
    container_name: annapurna-hive-metastore
    environment:
      SERVICE_NAME: metastore
      HADOOP_CLASSPATH: "/opt/hadoop/share/hadoop/tools/lib/*"
    ports:
      - "9083:9083"
    volumes:
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro

  trino:
    image: trinodb/trino:476
    container_name: annapurna-trino
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - minio
      - hive-metastore
    volumes:
      - ./trino/catalog:/etc/trino/catalog

volumes:
  minio_data:
  postgres_data: